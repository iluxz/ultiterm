<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ultiterm</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div id="app">
      <header class="titlebar" data-tauri-drag-region>
        <div class="brand">
          <span class="brand-mark">U</span>
          <span class="brand-name">ultiterm</span>
          <span class="brand-tag">windows-first / lightweight / yours</span>
        </div>
        <div class="title-actions">
          <button id="new-tab" class="ghost-btn" title="New terminal">+ tab</button>
          <div class="status-pill"><span id="status-dot" class="dot"></span><span id="status-text">booting</span></div>
        </div>
      </header>

      <div class="workspace">
        <aside class="sidebar">
          <div class="side-block">
            <div class="side-label">sessions</div>
            <div id="tabs" class="tabs"></div>
          </div>
          <div class="side-block side-info">
            <div class="side-label">ultiterm</div>
            <p>insane customization starts here. this is the base shell: tauri + webview2 + xterm + conpty.</p>
            <p class="muted">next up: themes, keybinds, splits, profiles, shaders, config hot-reload.</p>
          </div>
        </aside>

        <main class="terminal-shell">
          <div class="terminal-head">
            <div id="tab-title" class="tab-title">terminal</div>
            <div class="terminal-meta" id="term-meta">0x0</div>
          </div>
          <div id="terminal-root" class="terminal-root"></div>
        </main>
      </div>
    </div>
  </body>
</html>
