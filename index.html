<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ultiterm</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div id="app">
      <header class="titlebar" data-tauri-drag-region>
        <div class="brand">
          <span class="brand-mark">U</span>
          <span class="brand-name">ultiterm</span>
        </div>
        <div id="tabs" class="tab-strip"></div>
        <div class="title-actions">
          <select id="shell-select" class="shell-select" title="Shell for new tabs"></select>
          <button id="new-tab" class="ghost-btn" title="New terminal (Ctrl+T)">+</button>
          <button id="settings-btn" class="ghost-btn" title="Settings (Ctrl+,)">⚙</button>
          <div class="status-pill"><span id="status-dot" class="dot"></span><span id="status-text">booting</span></div>
        </div>
      </header>
      <main class="terminal-shell">
        <div id="find-bar" class="find-bar hidden">
          <input id="find-input" type="text" placeholder="Find in terminal..." />
          <button id="find-prev" class="ghost-btn wide">prev</button>
          <button id="find-next" class="ghost-btn wide">next</button>
          <button id="find-close" class="ghost-btn">×</button>
        </div>
        <div id="terminal-root" class="terminal-root"></div>
      </main>
      <div id="palette-modal" class="modal hidden">
        <div class="modal-card palette-card">
          <div class="modal-head"><div><div class="modal-title">command palette</div><div class="modal-sub">run an Ultiterm action</div></div><button id="palette-close" class="ghost-btn">×</button></div>
          <input id="palette-input" class="palette-input" type="text" placeholder="Type an action..." autocomplete="off" />
          <div id="palette-list" class="palette-list"></div>
        </div>
      </div>
      <div id="settings-modal" class="modal hidden">
        <div class="modal-card">
          <div class="modal-head"><div><div class="modal-title">settings</div><div id="config-path" class="modal-sub"></div></div><button id="settings-close" class="ghost-btn">×</button></div>
          <div class="settings-grid">
            <label>default shell<select id="cfg-shell"></select></label>
            <label>font size<input id="cfg-font-size" type="number" min="10" max="32" step="1"></label>
            <label class="span2">font family<input id="cfg-font-family" type="text"></label>
            <label>cursor<select id="cfg-cursor"><option value="bar">bar</option><option value="block">block</option><option value="underline">underline</option></select></label>
            <label>cursor blink<select id="cfg-blink"><option value="true">on</option><option value="false">off</option></select></label>
            <label>padding<input id="cfg-padding" type="number" min="0" max="40" step="1"></label>
            <label>accent<input id="cfg-accent" type="color"></label>
            <label>background<input id="cfg-bg" type="color"></label>
            <label>foreground<input id="cfg-fg" type="color"></label>
            <label>opacity<input id="cfg-opacity" type="number" min="0.2" max="1" step="0.05"></label>
            <label>vibrancy<select id="cfg-vibrancy"><option value="none">none</option><option value="acrylic">acrylic</option><option value="mica">mica</option></select></label>
            <label>scrollback<input id="cfg-scrollback" type="number" min="500" max="50000" step="500"></label>
            <label>restore session<select id="cfg-restore"><option value="true">on</option><option value="false">off</option></select></label>
          </div>
          <div class="modal-actions"><button id="settings-save" class="primary-btn">save config</button><button id="settings-reload" class="ghost-btn wide">reload</button></div>
        </div>
      </div>
    </div>
  </body>
</html>
